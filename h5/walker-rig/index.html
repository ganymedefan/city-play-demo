<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>中间人物 · 骨骼绑定预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2eee5;color:#214c48;font:15px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:0 auto;padding:26px 24px}h1{font-size:25px;letter-spacing:.02em;margin:0 0 4px}p{margin:0 0 16px;color:#52716b}a{color:#287eff}header{display:flex;justify-content:space-between;gap:20px;align-items:start}.layout{display:grid;grid-template-columns:minmax(340px,1fr) 310px;gap:22px}.stage{position:relative;min-height:650px;background:#d9eff2;border-radius:20px;overflow:hidden;display:grid;place-items:center}.view{position:relative;width:340px;height:648px;transition:transform .35s}.view.poster{transform:rotate(-27deg) scale(.88)}canvas{position:absolute;inset:0;width:100%;height:100%}#bones{pointer-events:none}.panel{background:#fffdf7;border-radius:20px;padding:22px;align-self:start}.panel label{display:block;margin:18px 0 7px;font-weight:600}.panel input[type=range]{width:100%;accent-color:#287eff}.row{display:flex;gap:8px;flex-wrap:wrap}button{background:#287eff;color:white;border:0;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}button.secondary{background:#e7efeb;color:#214c48}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f4c600;outline-offset:3px}.check{display:flex!important;gap:8px;align-items:center;font-weight:400!important}.hint{font-size:13px;margin:16px 0 0;color:#667b75}output{font-variant-numeric:tabular-nums}.legend{display:flex;gap:14px;font-size:13px;margin-top:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.manual{border-top:1px solid #e4e6dd;margin-top:18px;padding-top:12px}.manual label{font-size:13px;margin:9px 0 0}.manual select{width:100%;padding:7px;font:inherit}.status{position:absolute;left:18px;bottom:14px;font-size:12px;color:#37665f}.badge{background:#fff8da;display:inline-block;padding:3px 10px;border-radius:15px;font-size:12px;margin-bottom:10px}.error{color:#9b3928}
@media(max-width:740px){main{padding:16px}.layout{grid-template-columns:1fr}.stage{min-height:460px}.view{height:min(62svh,570px);width:auto;aspect-ratio:1148/2188}.panel{order:2}header{display:block}header a{display:inline-block;margin-bottom:14px}}
</style>
<main><header><div><span class="badge">仅中间人物 · 独立预览</span><h1>骨骼绑定与小幅动作</h1><p>使用原画贴图。可以暂停、拖动进度，或单独转动关节。</p></div><a href="../index.html">返回 H5</a></header>
<div class="layout"><section class="stage" aria-label="人物骨骼动画预览"><div class="view" id="view"><canvas id="art" width="688" height="1312" aria-label="原画骨骼动画"></canvas><canvas id="bones" width="688" height="1312" aria-label="骨骼连接示意"></canvas></div><output class="status" id="status">正在加载原画…</output></section>
<aside class="panel"><div class="row"><button id="play">暂停</button><button id="rest" class="secondary">原始姿势</button></div>
<label for="phase">动作进度 <output id="phase-value">0%</output></label><input id="phase" type="range" min="0" max="1000" value="0">
<label for="amplitude">幅度 <output id="amplitude-value">小</output></label><input id="amplitude" type="range" min="0" max="100" value="65">
<label for="speed">周期 <output id="speed-value">3.2 秒</output></label><input id="speed" type="range" min="2200" max="5000" step="100" value="3200">
<label class="check"><input id="show-bones" type="checkbox" checked>显示骨骼</label><label class="check"><input id="poster" type="checkbox">查看海报中的倾斜角度</label>
<div class="legend"><span><i class="dot" style="background:#ed7153"></i>右腿</span><span><i class="dot" style="background:#287eff"></i>左腿</span></div>
<div class="manual"><label for="joint">单关节检查</label><select id="joint"><option value="1">右髋</option><option value="2">右膝</option><option value="3">右踝</option><option value="4">左髋</option><option value="5">左膝</option><option value="6">左踝</option></select><label for="joint-angle">转动角度 <output id="joint-value">0°</output></label><input id="joint-angle" type="range" min="-6" max="6" step=".1" value="0"><button id="resume" class="secondary">回到连续动作</button></div>
<p class="hint">这是骨骼绑定检查版。原图只有一个视角，目前用于检查关节连接和小幅运动；完整的左右换步仍需解决腿部遮挡和鞋面透视。</p></aside></div></main>
<script type="module" src="preview.js"></script>
</html>
